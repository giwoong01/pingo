services:
  backend:
    build:
      context: ./backend
      target: dev
    environment:
      PORT: ${BACKEND_PORT:-3002}
      FRONTEND_PORT: ${FRONTEND_PORT:-3001}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://localhost:9090/api/v1/query}
      PROMETHEUS_TARGET_LABELS: ${PROMETHEUS_TARGET_LABELS:-}
      PROMETHEUS_PROCESS_LABELS: ${PROMETHEUS_PROCESS_LABELS:-}
      PROMETHEUS_GC_LABELS: ${PROMETHEUS_GC_LABELS:-}
      PROMETHEUS_DB_LABELS: ${PROMETHEUS_DB_LABELS:-}
      PROMETHEUS_HTTP_LABELS: ${PROMETHEUS_HTTP_LABELS:-}
      PROMETHEUS_HEAP_USED_QUERY: ${PROMETHEUS_HEAP_USED_QUERY:-}
      PROMETHEUS_HEAP_MAX_QUERY: ${PROMETHEUS_HEAP_MAX_QUERY:-}
      PROMETHEUS_CPU_QUERY: ${PROMETHEUS_CPU_QUERY:-}
      PROMETHEUS_GC_PAUSE_AVG_MS_QUERY: ${PROMETHEUS_GC_PAUSE_AVG_MS_QUERY:-}
      PROMETHEUS_DB_ACTIVE_CONNECTIONS_QUERY: ${PROMETHEUS_DB_ACTIVE_CONNECTIONS_QUERY:-}
      PROMETHEUS_HTTP_METRIC: ${PROMETHEUS_HTTP_METRIC:-http_server_requests_seconds_count}
      PROMETHEUS_HTTP_2XX_RATE_QUERY: ${PROMETHEUS_HTTP_2XX_RATE_QUERY:-}
      PROMETHEUS_HTTP_4XX_RATE_QUERY: ${PROMETHEUS_HTTP_4XX_RATE_QUERY:-}
      PROMETHEUS_HTTP_5XX_RATE_QUERY: ${PROMETHEUS_HTTP_5XX_RATE_QUERY:-}
      PROMETHEUS_NODE_LABELS: ${PROMETHEUS_NODE_LABELS:-}
      PROMETHEUS_NODE_MEM_USED_QUERY: ${PROMETHEUS_NODE_MEM_USED_QUERY:-}
      PROMETHEUS_NODE_MEM_TOTAL_QUERY: ${PROMETHEUS_NODE_MEM_TOTAL_QUERY:-}
      PROMETHEUS_NODE_MEM_AVAILABLE_QUERY: ${PROMETHEUS_NODE_MEM_AVAILABLE_QUERY:-}
      PROMETHEUS_NODE_SWAP_USED_QUERY: ${PROMETHEUS_NODE_SWAP_USED_QUERY:-}
      PROMETHEUS_NODE_SWAP_TOTAL_QUERY: ${PROMETHEUS_NODE_SWAP_TOTAL_QUERY:-}
      PROMETHEUS_NODE_LOAD1_QUERY: ${PROMETHEUS_NODE_LOAD1_QUERY:-}
      INSTANCE_MEMORY_WARN_RATIO: ${INSTANCE_MEMORY_WARN_RATIO:-0.85}
      INSTANCE_MEMORY_CRITICAL_RATIO: ${INSTANCE_MEMORY_CRITICAL_RATIO:-0.95}
      INSTANCE_MEMORY_WARN_CLEAR_RATIO: ${INSTANCE_MEMORY_WARN_CLEAR_RATIO:-0.83}
      INSTANCE_MEMORY_CRITICAL_CLEAR_RATIO: ${INSTANCE_MEMORY_CRITICAL_CLEAR_RATIO:-0.93}
      JVM_HEAP_WARN_RATIO: ${JVM_HEAP_WARN_RATIO:-0.8}
      JVM_HEAP_CRITICAL_RATIO: ${JVM_HEAP_CRITICAL_RATIO:-0.95}
      JVM_HEAP_MAX_FALLBACK_BYTES: ${JVM_HEAP_MAX_FALLBACK_BYTES:-2147483648}
      MONITORING_ALLOW_RANDOM_FALLBACK: ${MONITORING_ALLOW_RANDOM_FALLBACK:-false}
      ALERT_ENGINE_ENABLED: ${ALERT_ENGINE_ENABLED:-true}
      ALERT_ENGINE_CONCURRENCY: ${ALERT_ENGINE_CONCURRENCY:-3}
      SLO_ERROR_BUDGET_RATIO: ${SLO_ERROR_BUDGET_RATIO:-0.001}
      OPS_PUBLIC_URL: ${OPS_PUBLIC_URL:-http://localhost:${FRONTEND_PORT:-3001}}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      AI_OLLAMA_TIMEOUT_MS: ${AI_OLLAMA_TIMEOUT_MS:-20000}
      AI_OLLAMA_RETRIES: ${AI_OLLAMA_RETRIES:-0}
      AI_OLLAMA_NUM_PREDICT: ${AI_OLLAMA_NUM_PREDICT:-180}
      AI_PROVIDER_BACKOFF_BASE_MS: ${AI_PROVIDER_BACKOFF_BASE_MS:-30000}
      AI_PROVIDER_BACKOFF_MAX_MS: ${AI_PROVIDER_BACKOFF_MAX_MS:-300000}
    ports:
      - "${BACKEND_PORT:-3002}:3002"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3002}
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  backend-node-modules:
  frontend-node-modules:
  ollama-data:
